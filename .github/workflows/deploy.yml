name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a year, so that the footer's © year follows the calendar.
  schedule:
    - cron: "0 6 1 1 *"

permissions:
  contents: read

# One deploy at a time: a push waits for the running deploy. A pull request's newer push cancels its older check.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro keeps the images it optimized (AVIF/WebP) in node_modules/.astro/assets:
      # restore them so that a build only encodes the ones that changed.
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/components/ranch/Screenshot.astro', 'package-lock.json') }}
          restore-keys: |
            astro-assets-

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The secrets live in the repository settings, never in the code. Until they exist
      # (see the README's first-time setup), main is checked and built but not deployed.
      - name: Look for the Cloudflare secrets
        id: cloudflare
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      # Pull requests only check and build.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && steps.cloudflare.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

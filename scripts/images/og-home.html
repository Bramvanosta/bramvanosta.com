<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bramvanosta.com social card</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 400;
        src: url("../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-weight: 500;
        src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-500-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        padding: 80px 96px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #ffffff;
        color: #111111;
        font-family: "Inter", Helvetica, Arial, sans-serif;
      }
      .icon {
        display: block;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0 0 22px;
        font-family: "Newsreader", Georgia, serif;
        font-size: 80px;
        line-height: 1;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 38px;
        line-height: 1.35;
        max-width: 980px;
      }
      .flourish {
        position: relative;
        display: inline-block;
      }
      .flourish svg {
        position: absolute;
        left: -2%;
        bottom: -10px;
        width: 104%;
        height: 18px;
        overflow: visible;
      }
      .flourish path {
        fill: none;
        stroke: #d93b1f;
        stroke-width: 3.5;
        stroke-linecap: round;
      }
      .footer {
        padding-top: 24px;
        border-top: 1px solid #e5e5e5;
        font-family: "IBM Plex Mono", Menlo, Courier, monospace;
        font-size: 22px;
        color: #5f5f5f;
      }
    </style>
  </head>
  <body>
    <div>
      <!-- The icon of the Bram van Osta design system: the tile, its four diamonds, the tulip. -->
      <svg class="icon" width="104" height="104" viewBox="0 0 32 32">
        <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6" fill="#ffffff" stroke="#2350a0" stroke-width="1.5" />
        <path
          d="M5.5 4L7 5.5L5.5 7L4 5.5Z M26.5 4L28 5.5L26.5 7L25 5.5Z M5.5 25L7 26.5L5.5 28L4 26.5Z M26.5 25L28 26.5L26.5 28L25 26.5Z"
          fill="#2350a0"
        />
        <g transform="translate(16 16.25) scale(0.64) translate(-15.25 -16.25)">
          <path d="M9 4.5L12.75 9L16 3.5L19.25 9L23 4.5V13A7 7 0 0 1 9 13Z" fill="#d93b1f" />
          <rect x="15" y="19.5" width="2" height="9.5" fill="#2350a0" />
          <path d="M15 29C10 28.5 7.5 24.5 7.5 20.5C11.5 21.5 14.5 24.5 15 27Z" fill="#2350a0" />
        </g>
      </svg>
      <h1>Bram van Osta</h1>
      <p>
        Freelance full-stack developer. I build web and desktop apps,
        <span class="flourish"
          >and help teams ship them.<svg viewBox="0 0 200 12" preserveAspectRatio="none">
            <path d="M3 8.5C38 4 78 3.5 112 5.5S170 9.5 197 4.5"></path></svg
        ></span>
      </p>
    </div>
    <div class="footer">South-west France · bramvanosta.com</div>
  </body>
</html>
